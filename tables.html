<h1>HTML Tables</h1>
<hr>

<h3>Definition:</h3>
<p>HTML tables are used to display information in rows and columns. Common table elements include table, tr, th and td.</p>

<h3>Example:</h3>
<pre><table><tr><th>Name</th><th>Age</th></tr><tr><td>Rahul</td><td>20</td></tr></table></pre>
