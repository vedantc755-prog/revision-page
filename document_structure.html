<h1>HTML Document Structure</h1>
<hr>

<h3>Definition:</h3>
<p>HTML document structure is the basic arrangement of an HTML page. It commonly contains html, head, title and body elements.</p>

<h3>Example:</h3>
<pre><html>\n<head>\n<title>My Page</title>\n</head>\n<body>\nHello\n</body>\n</html></pre>
