<h1>Nested Elements</h1>
<hr>

<h3>Definition:</h3>
<p>Nested elements are HTML elements placed inside another HTML element. The inner element is called a child element.</p>

<h3>Example:</h3>
<pre><p>This is <b>bold</b> text.</p></pre>
