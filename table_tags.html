<h1>Table Tags</h1>
<hr>

<h3>Definition:</h3>
<p>Common table tags include table for the table, tr for a row, th for a heading cell and td for a data cell.</p>

<h3>Example:</h3>
<pre><tr><th>Name</th><th>Age</th></tr></pre>
