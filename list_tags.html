<h1>List Tags</h1>
<hr>

<h3>Definition:</h3>
<p>Common HTML list tags are ul for unordered lists, ol for ordered lists, li for list items, dl for description lists, dt for terms and dd for descriptions.</p>

<h3>Example:</h3>
<pre><ol><li>First</li><li>Second</li></ol></pre>
