<h1>Unordered, Ordered and Description List</h1>
<hr>

<h3>Definition:</h3>
<p>HTML provides three main types of lists: unordered lists use bullets, ordered lists use numbers or letters, and description lists contain terms and descriptions.</p>

<h3>Example:</h3>
<pre><ul>\n<li>Apple</li>\n<li>Banana</li>\n</ul></pre>
